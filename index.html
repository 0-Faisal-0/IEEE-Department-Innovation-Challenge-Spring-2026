<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IEEE Workshop Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --border: #e3e1d9;
  --text: #111110;
  --muted: #888580;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── Navbar ── */
.navbar {
  height: 72px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.ieee-logo img {
  height: 50px;
  width: auto;
  display: block;
  filter: invert(1);
  flex-shrink: 0;
}

.logo-divider {
  width: 1px; height: 26px;
  background: var(--border);
  flex-shrink: 0;
}

.logo-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.03em;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.logo-label strong {
  display: block;
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
}

.nav-link {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
  letter-spacing: 0.03em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-link:hover {
  color: var(--text);
  border-color: var(--text);
  background: var(--bg);
}
.nav-link svg { flex-shrink: 0; }

/* ── Main ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 24px;
}

/* ── Bot ── */
.bot-wrap {
  width: 100px;
  height: 100px;
  position: relative;
  margin-bottom: 24px;
}

.bot-body {
  width: 76px;
  height: 62px;
  background: var(--surface);
  border: 2px solid var(--text);
  border-radius: 22px;
  position: absolute;
  left: 12px; top: 20px;
  transition: transform 0.3s ease, border-radius 0.3s ease;
  animation: floatBot 3s ease-in-out infinite;
}

.bot-antenna {
  width: 3px; height: 16px;
  background: var(--text);
  border-radius: 3px;
  position: absolute;
  top: 4px; left: 48px;
  transform-origin: bottom center;
  transition: transform 0.3s ease;
}
.bot-antenna::after {
  content: '';
  width: 10px; height: 10px;
  background: var(--text);
  border-radius: 50%;
  position: absolute;
  top: -8px; left: -3.5px;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

.bot-face {
  width: 50px; height: 26px;
  background: var(--text);
  border-radius: 10px;
  position: absolute;
  left: 13px; top: 12px;
  overflow: hidden;
  transition: border-radius 0.2s;
}

.eye {
  width: 9px; height: 9px;
  background: var(--bg);
  border-radius: 50%;
  position: absolute;
  top: 8px;
  transition: height 0.15s ease, top 0.15s ease, border-radius 0.15s ease, transform 0.2s ease;
}
.eye.left  { left: 9px; }
.eye.right { right: 9px; }

.bot-mouth {
  width: 18px; height: 3px;
  background: var(--bg);
  border-radius: 3px;
  position: absolute;
  bottom: 7px;
  left: 50%; transform: translateX(-50%);
  transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease, bottom 0.3s ease;
}

/* ── idle: just float ── */

/* ── typing: eyes scan left-right, antenna tilts ── */
.bot-wrap.typing .eye { animation: eyeScan 0.6s ease-in-out infinite alternate; }
.bot-wrap.typing .bot-antenna { animation: antTilt 0.6s ease-in-out infinite alternate; }
.bot-wrap.typing .bot-mouth { width: 10px; }

/* ── thinking: squint eyes, round mouth, body rocks ── */
.bot-wrap.thinking .bot-body { animation: floatBot 3s ease-in-out infinite, thinkRock 0.5s ease-in-out infinite; }
.bot-wrap.thinking .eye { height: 5px; top: 10px; border-radius: 2px; animation: eyeScan 0.7s ease-in-out infinite alternate; }
.bot-wrap.thinking .bot-mouth { width: 8px; height: 8px; border-radius: 50%; bottom: 5px; }
.bot-wrap.thinking .bot-antenna::after { animation: antPing 0.5s ease-in-out infinite; }

/* ── answering: big smile, happy eyes, bounce ── */
.bot-wrap.answering .bot-body { animation: answerPop 0.55s cubic-bezier(0.22,1,0.36,1) both; }
.bot-wrap.answering .eye { height: 5px; top: 10px; border-radius: 0 0 3px 3px; }
.bot-wrap.answering .bot-mouth { width: 26px; height: 7px; border-radius: 0 0 13px 13px; bottom: 5px; }
.bot-wrap.answering .bot-antenna::after { animation: antPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }

/* ── Main ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 24px;
}

/* ── Heading ── */
h1 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.4px;
  margin-bottom: 6px;
  text-align: center;
}
.subtitle {
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 300;
  color: var(--muted);
  margin-bottom: 24px;
  text-align: center;
}

/* ── QA Card ── */
.qa-card {
  width: 100%;
  max-width: 900px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 3px 20px rgba(0,0,0,0.05);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22,1,0.36,1);
  pointer-events: none;
}
.qa-card.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.qa-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 22px 22px;
}
.qa-row.answer {
  border-top: 1px solid var(--border);
  background: #fafaf8;
  min-height: 80px;
}

.badge {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 2px;
  border: 1px solid var(--border);
}
.q-badge { background: var(--text); color: var(--bg); border-color: var(--text); }
.a-badge { color: var(--muted); }

.q-text {
  font-size: 17px;
  font-weight: 500;
  line-height: 1.6;
  padding-top: 4px;
  color: var(--text);
}
.a-text {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.85;
  padding-top: 4px;
  color: #2e2d2b;
}
.placeholder { color: var(--muted) !important; font-weight: 300 !important; }

/* Rendered markdown inside answer */
.a-text strong { font-weight: 500; color: var(--text); }
.a-text em { font-style: italic; }
.a-text ol, .a-text ul { padding-left: 22px; margin: 8px 0; }
.a-text ol { list-style: decimal; }
.a-text ul { list-style: disc; }
.a-text li { margin: 6px 0; }
.a-text blockquote { border-left: 2px solid var(--border); padding-left: 14px; color: var(--muted); margin: 8px 0; }

/* Typing dots */
.typing { display: flex; gap: 5px; align-items: center; padding-top: 4px; }
.dot {
  width: 5px; height: 5px;
  background: var(--muted);
  border-radius: 50%;
  animation: dotBounce 1.1s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.15s; }
.dot:nth-child(3) { animation-delay: 0.30s; }

/* Cursor */
.cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--text);
  vertical-align: text-bottom;
  margin-left: 1px;
  animation: blink 0.75s step-end infinite;
}

/* ── Input bar ── */
.input-bar {
  width: 100%;
  max-width: 900px;
  margin-top: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  display: flex;
  gap: 10px;
  padding: 10px 10px 10px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-bar:focus-within {
  border-color: var(--text);
  box-shadow: 0 0 0 3px rgba(17,17,16,0.06);
}
.input-bar.sending { animation: inputPulse 0.35s ease; }

#msg {
  flex: 1;
  border: none; outline: none;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 400;
  color: var(--text);
  background: transparent;
}
#msg::placeholder { color: var(--muted); }

.ask-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--text);
  color: var(--bg);
  cursor: pointer;
  display: grid; place-items: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
}
.ask-btn:hover { transform: scale(1.07); }
.ask-btn:active { transform: scale(0.92); }
.ask-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.ask-btn.launch svg { animation: launchArrow 0.45s cubic-bezier(0.22,1,0.36,1) both; }
.ask-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.ask-btn.launch svg { animation: launchArrow 0.45s cubic-bezier(0.22,1,0.36,1) both; }

/* ── Footer ── */
footer {
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  padding: 20px;
  letter-spacing: 0.04em;
}

/* ── Keyframes ── */
@keyframes floatBot {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
@keyframes thinkRock {
  0%,100% { transform: translateY(-3px) rotate(-3deg); }
  50%      { transform: translateY(-3px) rotate(3deg); }
}
@keyframes answerPop {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-12px) scale(1.08); }
  65%  { transform: translateY(2px) scale(0.95); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes eyeScan {
  from { transform: translateX(-3px); }
  to   { transform: translateX(3px); }
}
@keyframes antTilt {
  from { transform: rotate(-10deg); }
  to   { transform: rotate(10deg); }
}
@keyframes antPing {
  0%,100% { transform: scale(1); opacity: 1; }
  50%     { transform: scale(1.6); opacity: 0.4; }
}
@keyframes antPop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.8); }
  100% { transform: scale(1); }
}
@keyframes dotBounce {
  0%,80%,100% { transform: translateY(0); opacity: 0.3; }
  40%          { transform: translateY(-5px); opacity: 1; }
}
@keyframes blink {
  0%,100% { opacity: 1; } 50% { opacity: 0; }
}
@keyframes inputPulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(0.993); }
  100% { transform: scale(1); }
}
@keyframes launchArrow {
  0%   { transform: translateY(0) scale(1); opacity: 1; }
  40%  { transform: translateY(-8px) scale(0.6); opacity: 0; }
  41%  { transform: translateY(8px) scale(0.6); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .navbar { padding: 0 14px; gap: 8px; height: 56px; }
  .ieee-logo img { height: 30px; }
  .logo-label { display: none; }
  .logo-divider { display: none; }
  .nav-link { font-size: 11px; padding: 7px 12px; }
  .nav-link span { display: none; } /* hide text, show only icon on tiny screens */
  h1 { font-size: 20px; }
  .subtitle { font-size: 13px; }
  .bot-wrap { width: 100px; height: 100px; }
  .bot-body { width: 68px; height: 56px; left: 16px; top: 20px; }
  .bot-face { width: 46px; height: 24px; left: 11px; top: 12px; }
  .bot-antenna { left: 31px; }
  .qa-card { border-radius: 16px; }
  .qa-row { padding: 16px; gap: 12px; }
  .q-text { font-size: 15px; }
  .a-text { font-size: 14px; line-height: 1.75; }
  .badge { width: 28px; height: 28px; font-size: 11px; }
  #msg { font-size: 15px; }
  .ask-btn { width: 40px; height: 40px; }
  .main { padding: 20px 12px 16px; }
  .input-bar { border-radius: 18px; padding: 8px 8px 8px 16px; }
}
</style>
</head>

<!-- Main -->
<main class="main">

  <div class="bot-wrap" id="bot">
    <div class="bot-body">
      <div class="bot-antenna"></div>
      <div class="bot-face">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
    </div>
  </div>

  <h1>IEEE Workshop Chatbot</h1>
  <p class="subtitle">ask anything about the innovation challenge</p>

  <div class="qa-card">
    <div class="qa-row">
      <div class="badge q-badge">Q</div>
      <div class="q-text placeholder" id="questionText">Your question will appear here.</div>
    </div>
    <div class="qa-row answer">
      <div class="badge a-badge">A</div>
      <div class="a-text placeholder" id="answerText">The answer will appear here.</div>
    </div>
  </div>

  <div class="input-bar" id="input-bar">
    <input id="msg" placeholder="Ask about the IEEE Innovation Challenge..." />
    <button class="ask-btn" id="ask-btn" title="Ask">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M7.5 12V3M3 7.5l4.5-4.5 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</main>

<footer>© 2026 IEEE Department Innovation Challenge · All rights reserved</footer>

<script>
  let busy = false;
  const history = [];

  const msgEl    = document.getElementById('msg');
  const askBtn   = document.getElementById('ask-btn');
  const inputBar = document.getElementById('input-bar');
  const qText    = document.getElementById('questionText');
  const aText    = document.getElementById('answerText');
  const bot      = document.getElementById('bot');

  msgEl.onkeydown = e => { if (e.key === 'Enter') ask(); };
  msgEl.oninput   = () => {
    if (msgEl.value.trim()) setBotState('typing');
    else setBotState('');
  };
  askBtn.onclick  = ask;

  function setBotState(s) {
    bot.classList.remove('typing', 'thinking', 'answering');
    if (s) bot.classList.add(s);
  }

  // ── Markdown → HTML ──
  function parseMarkdown(text) {
    return text
      // Bold **text**
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      // Italic *text*
      .replace(/(?<!\*)\*(?!\*)(.*?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
      // Numbered list lines: "1. item"
      .replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>')
      // Wrap consecutive <li> in <ol>
      .replace(/(<li>.*<\/li>\n?)+/g, m => `<ol>${m}</ol>`)
      // Bullet list lines: "- item" or "* item"
      .replace(/^[-*]\s+(.+)$/gm, '<li>$1</li>')
      // Wrap stray <li> (bullets) in <ul>
      .replace(/(?<!<\/ol>)(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
      // Blockquote > text
      .replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>')
      // Double newline → paragraph break
      .replace(/\n{2,}/g, '<br><br>')
      // Single newline → line break
      .replace(/\n/g, '<br>');
  }

  async function ask() {
    if (busy) return;
    const msg = msgEl.value.trim();
    if (!msg) return;

    // Button launch animation
    askBtn.classList.remove('launch');
    void askBtn.offsetWidth;
    askBtn.classList.add('launch');

    // Input pulse
    inputBar.classList.remove('sending');
    void inputBar.offsetWidth;
    inputBar.classList.add('sending');

    document.querySelector('.qa-card').classList.add('visible');
    qText.classList.remove('placeholder');
    qText.textContent = msg;
    msgEl.value = '';
    askBtn.disabled = true;
    busy = true;

    // Bot thinks
    setBotState('thinking');
    aText.classList.remove('placeholder');
    aText.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

    try {
      const response = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });

      const data = await response.json();

      // Bot answers — bounce animation
      setBotState('answering');
      setTimeout(() => setBotState(''), 700);

      aText.innerHTML = parseMarkdown(data.reply || 'Sorry, I could not answer that.');

    } catch (err) {
      setBotState('');
      aText.style.color = '#c0392b';
      aText.textContent = 'Something went wrong. Please try again.';
    }

    askBtn.disabled = false;
    busy = false;
  }
</script>
</body>

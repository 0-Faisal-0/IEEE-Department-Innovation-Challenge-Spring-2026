<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>IEEE Workshop Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*, *::before, *::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --border:#e3e1d9;
  --text:#111110;
  --muted:#888580;
  --mono:'DM Mono', monospace;
  --sans:'DM Sans', sans-serif;
}

body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* Navbar */

.navbar{
  height:76px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 36px;
  gap:18px;
}

.logo-label{
  font-family:var(--mono);
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
}

.logo-label strong{
  display:block;
  color:var(--text);
  font-size:14px;
  font-weight:400;
}

/* Main */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

/* Bot */

.bot-wrap{
  width:110px;
  height:110px;
  position:relative;
  margin-bottom:24px;
}

.bot-body{
  width:82px;
  height:62px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:22px;
  position:absolute;
  left:14px;
  top:28px;
  box-shadow:0 6px 20px rgba(0,0,0,0.07);
  animation:floatBot 3s ease-in-out infinite;
}

.bot-antenna{
  width:4px;
  height:16px;
  background:var(--border);
  border-radius:3px;
  position:absolute;
  top:-16px;
  left:39px;
}

.bot-antenna::after{
  content:'';
  width:11px;
  height:11px;
  background:var(--text);
  border-radius:50%;
  position:absolute;
  top:-8px;
  left:-3px;
}

.bot-face{
  width:52px;
  height:30px;
  background:var(--text);
  border-radius:12px;
  position:absolute;
  left:15px;
  top:16px;
}

.eye{
  width:8px;
  height:8px;
  background:var(--bg);
  border-radius:50%;
  position:absolute;
  top:11px;
}

.eye.left{
  left:11px;
}

.eye.right{
  right:11px;
}

.bot-wrap.thinking .bot-body{
  animation:
    floatBot 3s ease-in-out infinite,
    thinkShake .4s ease-in-out infinite;
}

.bot-wrap.answering .bot-body{
  animation:answerBounce .55s cubic-bezier(.22,1,.36,1);
}

/* Heading */

h1{
  font-size:38px;
  font-weight:400;
  letter-spacing:-1px;
  margin-bottom:8px;
}

.subtitle{
  font-family:var(--mono);
  font-size:13px;
  color:var(--muted);
  margin-bottom:30px;
}

/* QA */

.qa-card{
  width:100%;
  max-width:720px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.05);

  opacity:0;
  transform:translateY(10px);
  pointer-events:none;

  transition:.35s;
}

.qa-card.visible{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.qa-row{
  display:flex;
  gap:18px;
  align-items:flex-start;
  padding:28px;
}

.qa-row.answer{
  border-top:1px solid var(--border);
  background:#fafaf8;
}

.badge{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--mono);
  font-size:13px;
  flex-shrink:0;
}

.q-badge{
  background:var(--text);
  color:var(--bg);
}

.a-badge{
  background:#efefeb;
  color:var(--muted);
}

.q-text{
  font-size:20px;
  line-height:1.5;
  font-weight:500;
}

.a-text{
  font-size:16px;
  line-height:1.8;
  color:#333;
}

.a-text ul{
  margin-top:12px;
  margin-left:22px;
}

.a-text li{
  margin-bottom:8px;
}

.a-text strong{
  font-weight:600;
}

/* Typing */

.typing{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--muted);
  animation:dotBounce 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

/* Input */

.input-bar{
  width:100%;
  max-width:720px;
  margin-top:18px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:22px;
  display:flex;
  gap:10px;
  padding:12px 12px 12px 22px;
}

.input-bar:focus-within{
  border-color:var(--text);
}

#msg{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-family:var(--sans);
  font-size:16px;
}

.ask-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  background:var(--text);
  color:white;
  cursor:pointer;
  font-size:18px;
}

.ask-btn:hover{
  transform:scale(1.05);
}

/* Footer */

footer{
  text-align:center;
  padding:18px;
  font-size:11px;
  color:var(--muted);
  font-family:var(--mono);
}

/* Animations */

@keyframes floatBot{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}

@keyframes thinkShake{
  0%,100%{
    transform:translateY(-3px) rotate(-2deg);
  }
  50%{
    transform:translateY(-3px) rotate(2deg);
  }
}

@keyframes answerBounce{
  0%{
    transform:translateY(0) scale(1);
  }
  35%{
    transform:translateY(-12px) scale(1.07);
  }
  100%{
    transform:translateY(0) scale(1);
  }
}

@keyframes dotBounce{
  0%,80%,100%{
    transform:translateY(0);
    opacity:.3;
  }
  40%{
    transform:translateY(-5px);
    opacity:1;
  }
}

@media(max-width:700px){

  h1{
    font-size:28px;
  }

  .qa-row{
    padding:20px;
  }

}

</style>
</head>

<body>

<header class="navbar">

  <div class="logo-label">
    <strong>IEEE Workshop Chatbot</strong>
    Spring 2026 AI Event Assistant
  </div>

</header>

<main class="main">

  <div class="bot-wrap" id="bot">

    <div class="bot-body">

      <div class="bot-antenna"></div>

      <div class="bot-face">

        <div class="eye left"></div>
        <div class="eye right"></div>

      </div>

    </div>

  </div>

  <h1>IEEE Workshop Chatbot</h1>

  <div class="subtitle">
    Ask anything about the event
  </div>

  <section class="qa-card" id="qaCard">

    <div class="qa-row">

      <div class="badge q-badge">
        Q
      </div>

      <div class="q-text" id="questionText"></div>

    </div>

    <div class="qa-row answer">

      <div class="badge a-badge">
        A
      </div>

      <div class="a-text" id="answerText">

        <span class="placeholder">
          Waiting for your question...
        </span>

      </div>

    </div>

  </section>

  <div class="input-bar">

    <input
      type="text"
      id="msg"
      placeholder="Ask your question..."
    />

    <button
      class="ask-btn"
      id="askBtn"
    >
      →
    </button>

  </div>

</main>

<footer>
  IEEE Department Innovation Challenge Spring 2026
</footer>

<script>

const msg =
document.getElementById("msg");

const askBtn =
document.getElementById("askBtn");

const questionText =
document.getElementById("questionText");

const answerText =
document.getElementById("answerText");

const qaCard =
document.getElementById("qaCard");

const bot =
document.getElementById("bot");

askBtn.addEventListener(
  "click",
  askQuestion
);

msg.addEventListener(
  "keydown",
  e => {
    if(e.key === "Enter"){
      askQuestion();
    }
  }
);

function formatReply(text){

  return text

    // Bold
    .replace(/\*\*(.*?)\*\*/g,
      "<strong>$1</strong>")

    // Numbered lists
    .replace(/^\s*\d+\.\s+(.*)$/gm,
      "<li>$1</li>")

    // Bullet lists
    .replace(/^\s*[-•]\s+(.*)$/gm,
      "<li>$1</li>")

    // Wrap lists
    .replace(/(<li>.*<\/li>)/gs,
      "<ul>$1</ul>")

    // Line breaks
    .replace(/\n/g,"<br>");

}

function showTyping(){

  answerText.innerHTML = `
    <div class="typing">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  `;

}

function typeAnswer(text){

  const formatted =
    formatReply(text);

  answerText.innerHTML = "";

  let i = 0;

  const speed = 5;

  function typingEffect(){

    if(i < formatted.length){

      answerText.innerHTML +=
        formatted.charAt(i);

      i++;

      setTimeout(
        typingEffect,
        speed
      );

    }

  }

  typingEffect();

}

async function askQuestion(){

  const userMessage =
    msg.value.trim();

  if(!userMessage) return;

  qaCard.classList.add("visible");

  questionText.innerText =
    userMessage;

  showTyping();

  bot.classList.add("thinking");

  askBtn.disabled = true;

  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:userMessage
        })

      });

    const data =
      await response.json();

    bot.classList.remove("thinking");

    bot.classList.add("answering");

    setTimeout(()=>{
      bot.classList.remove("answering");
    },600);

    typeAnswer(data.reply);

  }

  catch(error){

    answerText.innerHTML =
      "Server connection error.";

  }

  askBtn.disabled = false;

  msg.value = "";

}

</script>

</body>
</html>

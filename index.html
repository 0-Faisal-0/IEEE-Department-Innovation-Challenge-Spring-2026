<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>IEEE Workshop Chatbot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#f5f7fb;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#1d1d1f;
}

.container{
  width:100%;
  max-width:900px;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.badge{
  display:inline-block;
  background:#e9efff;
  color:#3f66ff;
  padding:8px 18px;
  border-radius:50px;
  font-size:14px;
  font-weight:600;
  margin-bottom:20px;
}

.hero h1{
  font-size:52px;
  line-height:1.1;
  margin-bottom:14px;
  color:#111827;
}

.hero p{
  color:#6b7280;
  font-size:18px;
}

.chat-card{
  background:white;
  border-radius:35px;
  padding:35px;
  box-shadow:
  0 10px 40px rgba(0,0,0,0.06);
}

.bot-area{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:30px;
}

.bot-avatar{
  width:85px;
  height:85px;
  border-radius:50%;
  background:linear-gradient(135deg,#4f7cff,#7a5cff);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
  animation:float 3s ease-in-out infinite;
}

.bot-face{
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  position:relative;
}

.bot-face::before,
.bot-face::after{
  content:'';
  position:absolute;
  width:6px;
  height:6px;
  background:#4f7cff;
  border-radius:50%;
  top:14px;
}

.bot-face::before{
  left:10px;
}

.bot-face::after{
  right:10px;
}

.bot-mouth{
  position:absolute;
  width:16px;
  height:8px;
  border-bottom:3px solid #4f7cff;
  border-radius:0 0 10px 10px;
  left:50%;
  transform:translateX(-50%);
  top:25px;
}

@keyframes float{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-8px);}
  100%{transform:translateY(0px);}
}

.bot-text h2{
  font-size:30px;
  margin-bottom:6px;
}

.bot-text p{
  color:#6b7280;
  font-size:16px;
}

.hidden{
  display:none;
}

.qa-card{
  margin-top:25px;
  background:#f8faff;
  border-radius:28px;
  padding:30px;
  animation:fadeIn .4s ease;
}

.question-row,
.answer-row{
  display:flex;
  gap:18px;
}

.question-row{
  margin-bottom:25px;
}

.circle{
  min-width:55px;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:700;
  color:white;
  font-size:22px;
}

.q-circle{
  background:#4f7cff;
}

.a-circle{
  background:#34c759;
}

.qa-content{
  flex:1;
}

.question-text{
  font-size:28px;
  font-weight:600;
  color:#111827;
}

.answer-text{
  font-size:19px;
  line-height:1.8;
  color:#374151;
}

.divider{
  height:1px;
  background:#e5e7eb;
  margin:25px 0;
}

.typing{
  display:flex;
  gap:6px;
  align-items:center;
  margin-top:10px;
}

.typing span{
  width:8px;
  height:8px;
  background:#4f7cff;
  border-radius:50%;
  animation:bounce 1.4s infinite;
}

.typing span:nth-child(2){
  animation-delay:.2s;
}

.typing span:nth-child(3){
  animation-delay:.4s;
}

@keyframes bounce{
  0%,80%,100%{
    transform:translateY(0);
    opacity:.5;
  }
  40%{
    transform:translateY(-8px);
    opacity:1;
  }
}

.input-area{
  margin-top:30px;
  display:flex;
  gap:15px;
}

.input-area input{
  flex:1;
  border:none;
  outline:none;
  background:#f3f6fb;
  border-radius:18px;
  padding:22px 24px;
  font-size:18px;
  font-family:'Poppins',sans-serif;
}

.send-btn{
  width:72px;
  border:none;
  border-radius:20px;
  background:linear-gradient(135deg,#4f7cff,#6f63ff);
  color:white;
  font-size:28px;
  cursor:pointer;
  transition:.3s;
}

.send-btn:hover{
  transform:scale(1.05);
}

.quick-buttons{
  display:flex;
  gap:12px;
  margin-top:22px;
  flex-wrap:wrap;
}

.quick-buttons button{
  border:none;
  background:#eef3ff;
  color:#4f7cff;
  padding:12px 18px;
  border-radius:50px;
  cursor:pointer;
  font-family:'Poppins',sans-serif;
  transition:.3s;
}

.quick-buttons button:hover{
  background:#4f7cff;
  color:white;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:768px){

  .hero h1{
    font-size:36px;
  }

  .question-text{
    font-size:22px;
  }

  .answer-text{
    font-size:17px;
  }

  .chat-card{
    padding:24px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <div class="badge">
      Spring 2026 Event Assistant
    </div>

    <h1>
      IEEE Workshop Chatbot
    </h1>

    <p>
      Ask anything about competitions, registration, venue, schedules, or event guidance.
    </p>

  </div>

  <div class="chat-card">

    <div class="bot-area">

      <div class="bot-avatar" id="botAvatar">

        <div class="bot-face">
          <div class="bot-mouth"></div>
        </div>

      </div>

      <div class="bot-text">
        <h2>AI Event Assistant</h2>
        <p>
          Ask your question below.
        </p>
      </div>

    </div>

    <section class="qa-card hidden" id="qaCard">

      <div class="question-row">

        <div class="circle q-circle">
          Q
        </div>

        <div class="qa-content">

          <div class="question-text" id="questionText">
          </div>

        </div>

      </div>

      <div class="divider"></div>

      <div class="answer-row">

        <div class="circle a-circle">
          A
        </div>

        <div class="qa-content">

          <div class="answer-text" id="answerText">
          </div>

          <div class="typing hidden" id="typing">

            <span></span>
            <span></span>
            <span></span>

          </div>

        </div>

      </div>

    </section>

    <div class="quick-buttons">

      <button onclick="quickAsk('What competitions are available?')">
        Competitions
      </button>

      <button onclick="quickAsk('What is the registration fee?')">
        Fee
      </button>

      <button onclick="quickAsk('Where is the venue?')">
        Venue
      </button>

      <button onclick="quickAsk('How can I prepare for the event?')">
        Success Tips
      </button>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask your question..."
      >

      <button
        class="send-btn"
        onclick="sendQuestion()"
      >
        →
      </button>

    </div>

  </div>

</div>

<script>

const input =
document.getElementById("userInput");

const questionText =
document.getElementById("questionText");

const answerText =
document.getElementById("answerText");

const typing =
document.getElementById("typing");

const qaCard =
document.getElementById("qaCard");

const botAvatar =
document.getElementById("botAvatar");

input.addEventListener("keypress",function(e){

  if(e.key==="Enter"){
    sendQuestion();
  }

});

function quickAsk(question){

  input.value = question;
  sendQuestion();

}

async function sendQuestion(){

  const message =
  input.value.trim();

  if(!message) return;

  qaCard.classList.remove("hidden");

  questionText.innerText = message;

  answerText.innerText = "";

  typing.classList.remove("hidden");

  botAvatar.style.transform =
  "scale(1.08)";

  try{

    const response =
    await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message
      })

    });

    const data =
    await response.json();

    typing.classList.add("hidden");

    typeAnswer(data.reply);

  }

  catch(error){

    typing.classList.add("hidden");

    answerText.innerText =
    "Server connection error.";

  }

  input.value = "";

  setTimeout(()=>{

    botAvatar.style.transform =
    "scale(1)";

  },500);

}

function typeAnswer(text){

  answerText.innerHTML = "";

  let i = 0;

  const speed = 12;

  function typingEffect(){

    if(i < text.length){

      answerText.innerHTML +=
      text.charAt(i);

      i++;

      setTimeout(
        typingEffect,
        speed
      );

    }

  }

  typingEffect();

}

</script>

</body>
</html>
